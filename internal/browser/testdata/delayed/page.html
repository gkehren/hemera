<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <title>Delayed browser fixture</title>
</head>
<body>
  <main id="initial">ready</main>
  <script>
    window.addEventListener("load", () => {
      setTimeout(async () => {
        try {
          await fetch("/delayed/api");
          const script = document.createElement("script");
          script.src = "/delayed/injected.js";
          script.onload = () => {
            document.cookie = "late_browser_cookie=synthetic-value; SameSite=Lax";
            const marker = document.createElement("div");
            marker.id = "late-browser-marker";
            document.body.appendChild(marker);
          };
          document.head.appendChild(script);
        } catch (_) {}
      }, 50);
    });
  </script>
</body>
</html>
