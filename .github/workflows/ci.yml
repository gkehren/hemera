name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux core checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files need gofmt:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Verify generated network policy
        shell: bash
        run: |
          go generate ./internal/networkguard
          git diff --exit-code -- internal/networkguard/iana_registry_generated.go

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Check vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false

      - name: Build CLI
        run: go build ./cmd/hemera

  browser-linux:
    name: Linux browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Locate Google Chrome
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            chromium_path="$(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            chromium_path="$(command -v google-chrome-stable)"
          else
            printf 'Google Chrome is required for browser integration tests.\n' >&2
            exit 1
          fi

          "${chromium_path}" --version
          printf 'HEMERA_CHROMIUM_PATH=%s\n' "${chromium_path}" >> "${GITHUB_ENV}"

      - name: Test browser integration
        run: |
          go test -p=1 -count=3 -timeout=5m -tags=browser_integration -run '^TestSandboxedChromiumBoundedDOMAndRequestConcurrency$' ./internal/browser
          go test -p=1 -v -count=1 -timeout=5m -tags=browser_integration ./internal/browser ./internal/scanner

      - name: Test browser integration with race detector
        run: |
          go test -p=1 -race -count=3 -timeout=5m -tags=browser_integration -run '^TestSandboxedChromiumBoundedDOMAndRequestConcurrency$' ./internal/browser
          go test -p=1 -race -v -count=1 -timeout=5m -tags=browser_integration ./internal/browser ./internal/scanner

  portable:
    name: ${{ matrix.os }} test and build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/hemera
